name: ThaparElectiveAI Cloud CI/CD Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL || 'https://thapar-elective-ml.onrender.com' }}
  ML_SERVICE_API_KEY: ${{ secrets.ML_SERVICE_API_KEY }}
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
  FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN || 'https://electives.thapar.edu,https://mtechproject.vercel.app' }}
  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://thapar-elective-backend.onrender.com/api/v1' }}

jobs:
  backend-and-frontend-build:
    name: Build & Typecheck Node.js Backend + React 18 Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Typecheck & Build Backend Workspace
        run: npm run typecheck --workspace=backend && npm run build --workspace=backend

      - name: Typecheck & Build Frontend Workspace
        run: npm run typecheck --workspace=frontend && npm run build --workspace=frontend

  ml-service-pytest:
    name: Verify Python 3.11 FastAPI ML Service & Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Verification Suite
        run: pytest -v
        env:
          APP_ENV: test
          ML_SERVICE_API_KEY: ${{ secrets.ML_SERVICE_API_KEY || 'ci-test-key-minimum-32-characters-length' }}

